name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-hack

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git

      # No features, then each feature on its own. `_api` and `_write` are
      # internal and only meaningful together with an API feature.
      - name: Run clippy (each feature)
        run: cargo hack clippy -p klaviyo --each-feature --skip _api,_write --all-targets -- -D warnings

      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check
