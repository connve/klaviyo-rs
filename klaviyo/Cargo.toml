[package]
name = "klaviyo"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "klaviyo"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
accounts = ["_api"]
campaigns = ["_write"]
events = ["_write"]
flows = ["_write"]
lists = ["_write"]
metrics = ["_write"]
profiles = ["_write"]
reporting = ["_write"]
segments = ["_api"]
templates = ["_write"]
trace = ["dep:tracing", "tracing/attributes"]
# Internal: enabled by every API feature. Gates the shared request plumbing,
# which is unused when no API is enabled. Not meant to be enabled directly.
_api = []
# Internal: enabled by every API feature with a request body. Gates the body
# serialization, which read-only APIs don't use. Not meant to be enabled
# directly.
_write = ["_api"]

[dependencies]
klaviyo_generated = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true, optional = true }
chrono = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
chrono = { workspace = true, features = ["now"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
anyhow = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "fan_out_campaign"
path = "../examples/klaviyo/fan_out_campaign.rs"
required-features = ["campaigns", "templates", "lists"]

[[example]]
name = "track_event"
path = "../examples/klaviyo/track_event.rs"
required-features = ["events"]

[[test]]
name = "accounts"
path = "tests/accounts.rs"
required-features = ["accounts"]

[[test]]
